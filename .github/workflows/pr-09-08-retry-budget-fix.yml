name: PR09-08 Retry Budget Fix

on:
  push:
    branches:
      - feat/pr-09-08-directed-cross-discussion
    paths:
      - .github/workflows/pr-09-08-retry-budget-fix.yml

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/pr-09-08-directed-cross-discussion
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Apply retry-capable collaboration budget policy
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          view_model = Path('app/src/main/java/com/elio/jianyu/ui/screens/execution/IssueCollaborationViewModel.kt')
          text = view_model.read_text(encoding='utf-8')
          replacements = {
              'import com.elio.jianyu.data.ExecutionRuntimeBudgetConfig\n':
                  'import com.elio.jianyu.collaboration.CollaborationExecutionBudgetPolicy\n',
              'budget = ExecutionRuntimeBudgetConfig(maxApiCalls = 1),':
                  'budget = CollaborationExecutionBudgetPolicy.directed(),',
              'budget = ExecutionRuntimeBudgetConfig(maxApiCalls = selected.size + 1),':
                  'budget = CollaborationExecutionBudgetPolicy.cross(selected.size),',
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one occurrence of {old!r}, found {count}')
              text = text.replace(old, new)
          view_model.write_text(text, encoding='utf-8')

          policy = Path('app/src/main/java/com/elio/jianyu/collaboration/CollaborationExecutionBudgetPolicy.kt')
          policy.write_text('''package com.elio.jianyu.collaboration

import com.elio.jianyu.data.ExecutionRuntimeBudgetConfig

/** 为首次执行、失败成员重试与整合重试预留共享调用预算。 */
object CollaborationExecutionBudgetPolicy {
    const val DIRECTED_MIN_API_CALLS: Int = 3
    const val CROSS_MIN_API_CALLS: Int = 8

    fun directed(): ExecutionRuntimeBudgetConfig = ExecutionRuntimeBudgetConfig(
        maxApiCalls = DIRECTED_MIN_API_CALLS,
    )

    fun cross(participantCount: Int): ExecutionRuntimeBudgetConfig {
        require(participantCount >= 2)
        val initialResponsesAndSynthesis = participantCount + 1
        val failedResponseRetriesAndSynthesisRetry = participantCount + 1
        return ExecutionRuntimeBudgetConfig(
            maxApiCalls = maxOf(
                CROSS_MIN_API_CALLS,
                initialResponsesAndSynthesis + failedResponseRetriesAndSynthesisRetry,
            ),
        )
    }
}
''', encoding='utf-8')

          test = Path('app/src/test/java/com/elio/jianyu/collaboration/CollaborationExecutionBudgetPolicyTest.kt')
          test.write_text('''package com.elio.jianyu.collaboration

import org.junit.Assert.assertEquals
import org.junit.Assert.assertThrows
import org.junit.Test

class CollaborationExecutionBudgetPolicyTest {
    @Test
    fun directedBudgetAllowsInitialCallAndExplicitRetries() {
        assertEquals(
            CollaborationExecutionBudgetPolicy.DIRECTED_MIN_API_CALLS,
            CollaborationExecutionBudgetPolicy.directed().maxApiCalls,
        )
    }

    @Test
    fun crossBudgetCoversResponsesFailedMemberRetriesAndSynthesisRetry() {
        assertEquals(8, CollaborationExecutionBudgetPolicy.cross(participantCount = 2).maxApiCalls)
        assertEquals(10, CollaborationExecutionBudgetPolicy.cross(participantCount = 4).maxApiCalls)
        assertEquals(14, CollaborationExecutionBudgetPolicy.cross(participantCount = 6).maxApiCalls)
    }

    @Test
    fun crossBudgetRejectsAnInvalidParticipantCount() {
        assertThrows(IllegalArgumentException::class.java) {
            CollaborationExecutionBudgetPolicy.cross(participantCount = 1)
        }
    }
}
''', encoding='utf-8')

          Path('.github/workflows/pr-09-08-retry-budget-fix.yml').unlink()
          PY

      - name: Verify focused JVM test and Kotlin compilation
        run: |
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest --tests 'com.elio.jianyu.collaboration.CollaborationExecutionBudgetPolicyTest' :app:compileDebugKotlin --stacktrace

      - name: Commit and push fix
        shell: bash
        run: |
          set -euo pipefail
          branch='feat/pr-09-08-directed-cross-discussion'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            app/src/main/java/com/elio/jianyu/collaboration/CollaborationExecutionBudgetPolicy.kt \
            app/src/main/java/com/elio/jianyu/ui/screens/execution/IssueCollaborationViewModel.kt \
            app/src/test/java/com/elio/jianyu/collaboration/CollaborationExecutionBudgetPolicyTest.kt \
            .github/workflows/pr-09-08-retry-budget-fix.yml
          git diff --cached --check
          git commit -m 'fix: 为协作重试预留执行预算'
          git fetch origin "$branch"
          git rebase "origin/$branch"
          git push origin HEAD:"$branch"
