name: Android CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CURRENT_PACKAGE: com.elio.jianyu
  CURRENT_LAUNCHER: com.elio.jianyu.MainActivity
  LEGACY_PACKAGE: com.elio.skillroundtable
  LEGACY_LAUNCHER: com.elio.skillroundtable.MainActivity
  CURRENT_SCHEMA: app/schemas/com.elio.jianyu.data.RoundtableDatabase/5.json
  LEGACY_SCHEMA: app/schemas/com.elio.skillroundtable.data.RoundtableDatabase/5.json
  MIGRATION_BASE_SHA: 4de0bfb0480ea84d3a88af12c11167a3a27c38dc

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          validate-wrappers: true

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Show Gradle environment
        run: ./gradlew --no-daemon --version

      - name: Run static app identity gate
        shell: pwsh
        run: ./tools/check-app-identity.ps1

      - name: Compile debug Kotlin
        run: ./gradlew --no-daemon --stacktrace compileDebugKotlin

      - name: Run debug unit tests
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest

      - name: Run debug lint
        run: ./gradlew --no-daemon --stacktrace lintDebug

      - name: Assemble debug APK
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Verify package migration, schemas and debug APK
        shell: bash
        run: |
          set -euo pipefail

          active_paths=(
            app/src/main/java/com/elio/jianyu
            app/src/test/java/com/elio/jianyu
            app/src/androidTest/java/com/elio/jianyu
            app/build.gradle.kts
            app/src/main/AndroidManifest.xml
            app/src/main/res/values/strings.xml
            run.ps1
          )

          if grep -RInF \
            --exclude-dir=build \
            --include='*.kt' \
            --include='*.kts' \
            --include='*.ps1' \
            --include='*.xml' \
            "${LEGACY_PACKAGE}" "${active_paths[@]}"; then
            echo "::error::Active source, test, resource or script still references the legacy package."
            exit 1
          fi

          if grep -RInE \
            --exclude-dir=build \
            --include='*.kt' \
            --include='*.kts' \
            'com\\+\.elio\\+\.skillroundtable|com[/\\]+elio[/\\]+skillroundtable' \
            app/src/main/java/com/elio/jianyu \
            app/src/test/java/com/elio/jianyu \
            app/src/androidTest/java/com/elio/jianyu; then
            echo "::error::Active Kotlin source still contains an escaped legacy package or path."
            exit 1
          fi

          grep -Fq '<string name="app_name">见域</string>' app/src/main/res/values/strings.xml
          test -f "${LEGACY_SCHEMA}"
          test -f "${CURRENT_SCHEMA}"
          git diff --exit-code "${MIGRATION_BASE_SHA}" -- "${LEGACY_SCHEMA}"

          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          old_path = Path(os.environ["LEGACY_SCHEMA"])
          new_path = Path(os.environ["CURRENT_SCHEMA"])
          old_bytes = old_path.read_bytes()
          new_bytes = new_path.read_bytes()
          old_json = json.loads(old_bytes)
          new_json = json.loads(new_bytes)
          if old_json != new_json:
              raise SystemExit("Room schemas differ semantically")

          normalize = lambda data: data.replace(b"\r\n", b"\n").replace(b"\r", b"\n")
          old_normalized = normalize(old_bytes)
          new_normalized = normalize(new_bytes)
          if old_normalized != new_normalized:
              raise SystemExit("Room schemas differ beyond line endings")

          print("old_raw_sha256=" + hashlib.sha256(old_bytes).hexdigest())
          print("new_raw_sha256=" + hashlib.sha256(new_bytes).hexdigest())
          print("normalized_sha256=" + hashlib.sha256(old_normalized).hexdigest())
          print("identity_hash=" + old_json["database"]["identityHash"])
          print("database_version=" + str(old_json["database"]["version"]))
          PY

          debug_apk="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print -quit)"
          if [[ -z "${debug_apk}" ]]; then
            echo "::error::Debug APK was not generated."
            exit 1
          fi

          aapt="$(find "${ANDROID_HOME}/build-tools" -type f -name aapt -print | sort -V | tail -n 1)"
          if [[ -z "${aapt}" ]]; then
            echo "::error::Unable to locate aapt in the Android SDK."
            exit 1
          fi

          badging="$("${aapt}" dump badging "${debug_apk}")"
          grep -Fq "package: name='${CURRENT_PACKAGE}'" <<<"${badging}"
          grep -Fq "launchable-activity: name='${CURRENT_LAUNCHER}'" <<<"${badging}"

          mapfile -t merged_manifests < <(
            find app/build/intermediates/merged_manifests -type f -name AndroidManifest.xml -print
          )
          if (( ${#merged_manifests[@]} == 0 )); then
            echo "::error::No merged AndroidManifest.xml was generated."
            exit 1
          fi
          if grep -HnF "${LEGACY_PACKAGE}" "${merged_manifests[@]}"; then
            echo "::error::Merged manifest still contains the legacy package or authority."
            exit 1
          fi
          if ! grep -HqF "${CURRENT_PACKAGE}" "${merged_manifests[@]}"; then
            echo "::error::Merged manifest does not contain the current package identity."
            exit 1
          fi

      - name: Generate ephemeral release test keystore
        shell: bash
        run: |
          set -euo pipefail

          ci_release_password="$(openssl rand -hex 24)"
          echo "::add-mask::${ci_release_password}"
          echo "CI_RELEASE_PASSWORD=${ci_release_password}" >> "${GITHUB_ENV}"

          keytool -genkeypair \
            -keystore "${RUNNER_TEMP}/ci-release-test.jks" \
            -storetype JKS \
            -storepass "${ci_release_password}" \
            -keypass "${ci_release_password}" \
            -alias ci-release \
            -keyalg RSA \
            -keysize 2048 \
            -validity 1 \
            -dname "CN=CI Release Test,OU=CI,O=Jianyu,L=Test,ST=Test,C=US"

      - name: Validate optional Gradle release signing configuration
        shell: bash
        run: |
          set -euo pipefail

          export RELEASE_STORE_FILE="${RUNNER_TEMP}/ci-release-test.jks"
          export RELEASE_STORE_PASSWORD="${CI_RELEASE_PASSWORD}"
          export RELEASE_KEY_ALIAS="ci-release"
          export RELEASE_KEY_PASSWORD="${CI_RELEASE_PASSWORD}"

          ./gradlew --no-daemon --stacktrace :app:validateSigningRelease

      - name: Remove ephemeral release test keystore
        if: always()
        shell: bash
        run: rm -f "${RUNNER_TEMP}/ci-release-test.jks"

      - name: Assemble optimized release APK
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Verify release package, R8 output and unsigned artifact
        shell: bash
        run: |
          set -euo pipefail

          release_apk="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          if [[ -z "${release_apk}" ]]; then
            echo "::error::Release APK was not generated."
            exit 1
          fi

          aapt="$(find "${ANDROID_HOME}/build-tools" -type f -name aapt -print | sort -V | tail -n 1)"
          release_badging="$("${aapt}" dump badging "${release_apk}")"
          grep -Fq "package: name='${CURRENT_PACKAGE}'" <<<"${release_badging}"

          if grep -RInF "${LEGACY_PACKAGE}" \
            app/build/outputs/mapping/release \
            app/build/outputs/logs 2>/dev/null; then
            echo "::error::R8 or build outputs still contain legacy class paths."
            exit 1
          fi

          apksigner="$(find "${ANDROID_HOME}/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)"
          if [[ -z "${apksigner}" ]]; then
            echo "::error::Unable to locate apksigner in the Android SDK."
            exit 1
          fi

          if "${apksigner}" verify "${release_apk}" >/dev/null 2>&1; then
            echo "::error::Public CI release APK is unexpectedly signed."
            exit 1
          fi

          echo "Confirmed unsigned public release APK: ${release_apk}"

      - name: Verify committed Room schema is current
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- app/schemas

          untracked_schema="$(git status --porcelain --untracked-files=all -- app/schemas)"
          if [[ -n "${untracked_schema}" ]]; then
            echo "::error::Room generated uncommitted schema files."
            printf '%s\n' "${untracked_schema}"
            exit 1
          fi

      - name: Upload generated Room schema
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: room-schema-${{ github.run_attempt }}
          path: app/schemas/**
          if-no-files-found: error
          retention-days: 7

      - name: Upload test, lint and R8 reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-ci-reports-${{ github.run_attempt }}
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
            app/build/test-results/testDebugUnitTest/**
            app/build/reports/tests/testDebugUnitTest/**
            app/build/outputs/mapping/release/**
            app/build/outputs/logs/**
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk-${{ github.run_attempt }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload release APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-apk-${{ github.run_attempt }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: ignore
          retention-days: 7

  legacy-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout fixed legacy baseline
        uses: actions/checkout@v4
        with:
          ref: ${{ env.MIGRATION_BASE_SHA }}
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: true
          validate-wrappers: true

      - name: Build fixed legacy debug APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

          legacy_apk="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print -quit)"
          aapt="$(find "${ANDROID_HOME}/build-tools" -type f -name aapt -print | sort -V | tail -n 1)"
          badging="$("${aapt}" dump badging "${legacy_apk}")"
          grep -Fq "package: name='${LEGACY_PACKAGE}'" <<<"${badging}"
          grep -Fq "launchable-activity: name='${LEGACY_LAUNCHER}'" <<<"${badging}"

      - name: Upload fixed legacy debug APK
        uses: actions/upload-artifact@v4
        with:
          name: legacy-debug-apk-${{ github.run_attempt }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

  migration-tests:
    needs:
      - build
      - legacy-apk
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download current debug APK
        uses: actions/download-artifact@v4
        with:
          name: debug-apk-${{ github.run_attempt }}
          path: artifacts/current

      - name: Download fixed legacy debug APK
        uses: actions/download-artifact@v4
        with:
          name: legacy-debug-apk-${{ github.run_attempt }}
          path: artifacts/legacy

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: true
          validate-wrappers: true

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Enable KVM permissions
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Verify coexistence, fresh identity and remaining instrumentation suite
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          profile: Nexus 6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            set -eu

            legacy_apk="$(find artifacts/legacy -type f -name '*.apk' -print -quit)"
            current_apk="$(find artifacts/current -type f -name '*.apk' -print -quit)"

            pwsh -NoProfile -File ./tools/verify-app-coexistence.ps1 \
              -LegacyApk "${legacy_apk}" \
              -CurrentApk "${current_apk}" \
              -Install \
              -CreatePrivateFileSentinel

            adb uninstall "${CURRENT_PACKAGE}.test" >/dev/null 2>&1 || true
            adb uninstall "${CURRENT_PACKAGE}" >/dev/null 2>&1 || true

            ./gradlew --no-daemon --stacktrace connectedDebugAndroidTest \
              -Pandroid.testInstrumentationRunnerArguments.class=com.elio.jianyu.identity.AppIdentityIsolationTest

            adb uninstall "${CURRENT_PACKAGE}.test" >/dev/null 2>&1 || true
            adb uninstall "${CURRENT_PACKAGE}" >/dev/null 2>&1 || true

            ./gradlew --no-daemon --stacktrace connectedDebugAndroidTest \
              -Pandroid.testInstrumentationRunnerArguments.notClass=com.elio.jianyu.identity.AppIdentityIsolationTest

      - name: Upload instrumentation test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-instrumentation-reports-${{ github.run_attempt }}
          path: |
            app/build/reports/androidTests/connected/**
            app/build/outputs/androidTest-results/connected/**
          if-no-files-found: ignore
          retention-days: 7
