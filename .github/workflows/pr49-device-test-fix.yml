name: PR49 device test fix

on:
  push:
    branches:
      - feat/pr-09-10b-audio-assets

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: feat/pr-09-10b-audio-assets
          fetch-depth: 0

      - name: Apply exact AndroidTest fixes
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, got {count}")
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

          audio_test = "app/src/androidTest/java/com/elio/jianyu/data/AudioAssetRepositoryDatabaseTest.kt"
          replace_once(
              audio_test,
              "    @Before\n    fun setUp() = runBlocking {",
              "    @Before\n    fun setUp() {\n        runBlocking {",
          )
          replace_once(
              audio_test,
              "        ).expectSuccess()\n    }\n\n    @After",
              "        ).expectSuccess()\n        }\n    }\n\n    @After",
          )

          resource_migration = "app/src/androidTest/java/com/elio/jianyu/data/ResourceLifecycleMigrationTest.kt"
          replace_once(
              resource_migration,
              "fun allMigrationsRemainContinuousFromVersion1ToVersion10()",
              "fun allMigrationsRemainContinuousFromVersion1ToVersion11()",
          )
          replace_once(
              resource_migration,
              "                9 to 10,\n            ),",
              "                9 to 10,\n                10 to 11,\n            ),",
          )

          execution_migration = "app/src/androidTest/java/com/elio/jianyu/data/ExecutionRuntimeMigrationTest.kt"
          replace_once(
              execution_migration,
              "fun allMigrationsRemainContinuousFromVersion1ToVersion10()",
              "fun allMigrationsRemainContinuousFromVersion1ToVersion11()",
          )
          replace_once(
              execution_migration,
              "                9 to 10,\n            ),",
              "                9 to 10,\n                10 to 11,\n            ),",
          )

          artifact_recovery = "app/src/androidTest/java/com/elio/jianyu/data/ArtifactSourceRecoveryDatabaseTest.kt"
          replace_once(
              artifact_recovery,
              "fun roomV10RecoversAllArtifactSourcesAfterDraftIsAbandoned()",
              "fun roomV11RecoversAllArtifactSourcesAfterDraftIsAbandoned()",
          )
          replace_once(
              artifact_recovery,
              "        assertEquals(10, database.openHelper.writableDatabase.version)",
              "        assertEquals(11, database.openHelper.writableDatabase.version)",
          )

          repository_test = "app/src/androidTest/java/com/elio/jianyu/data/RoomJianyuRepositoryDatabaseTest.kt"
          old_method = '''    @Test
              fun stageCreationUsesDomainOrderAndOnlyLatestEmptyStageCanBeUndone() = runBlocking {
                  repository.saveIssue(issueCommand()).successValue()
                  val stage1 = repository.createStage(
                      CreateStageCommand(
                          stageId = "stage-1",
                          issueId = ISSUE_ID,
                          title = "第二阶段",
                          objective = "验证方案",
                          createdAt = 20L
                      )
                  ).successValue()
                  val stage2 = repository.createStage(
                      CreateStageCommand(
                          stageId = "stage-2",
                          issueId = ISSUE_ID,
                          title = "第三阶段",
                          objective = "形成行动",
                          createdAt = 30L
                      )
                  ).successValue()

                  assertEquals(1, stage1.sequenceIndex)
                  assertEquals(2, stage2.sequenceIndex)
                  assertTrue(
                      repository.undoLatestUnrunStage(ISSUE_ID, stage1.id).failureError()
                          is RepositoryError.InvalidState
                  )
                  repository.undoLatestUnrunStage(ISSUE_ID, stage2.id).successValue()
                  assertEquals(listOf(0, 1), database.coreDomainDao().getStagesForIssue(ISSUE_ID).map { it.sequenceIndex })
              }
          '''
          new_method = '''    @Test
              fun legacyStageCreationUsesDomainOrderAndRequiresAdvancementRootForUndo() = runBlocking {
                  repository.saveIssue(issueCommand()).successValue()
                  val stage1 = repository.createStage(
                      CreateStageCommand(
                          stageId = "stage-1",
                          issueId = ISSUE_ID,
                          title = "第二阶段",
                          objective = "验证方案",
                          createdAt = 20L
                      )
                  ).successValue()
                  val stage2 = repository.createStage(
                      CreateStageCommand(
                          stageId = "stage-2",
                          issueId = ISSUE_ID,
                          title = "第三阶段",
                          objective = "形成行动",
                          createdAt = 30L
                      )
                  ).successValue()

                  assertEquals(1, stage1.sequenceIndex)
                  assertEquals(2, stage2.sequenceIndex)
                  assertTrue(
                      repository.undoLatestUnrunStage(ISSUE_ID, stage1.id).failureError()
                          is RepositoryError.InvalidState
                  )
                  assertTrue(
                      repository.undoLatestUnrunStage(ISSUE_ID, stage2.id).failureError()
                          is RepositoryError.InvalidState
                  )
                  assertEquals(
                      listOf(0, 1, 2),
                      database.coreDomainDao().getStagesForIssue(ISSUE_ID).map { it.sequenceIndex },
                  )
              }
          '''
          replace_once(repository_test, old_method, new_method)

      - name: Verify and commit fixes
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git rm .github/workflows/pr49-device-test-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/androidTest/java/com/elio/jianyu/data
          git commit -m "test: 修复 Room v11 设备测试门禁"
          git push origin HEAD:feat/pr-09-10b-audio-assets
