name: PR09-09 Instrumentation Fix V3

on:
  push:
    branches:
      - feat/pr-09-09-material-context-source

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: feat/pr-09-09-material-context-source
          fetch-depth: 0

      - name: Apply focused fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          runtime_path = Path("app/src/main/java/com/elio/jianyu/data/ExecutionRuntimeRepositoryComponent.kt")
          runtime = runtime_path.read_text(encoding="utf-8")
          start_marker = "        val currentSourcesMatch = command.contextUsage.sourceExpectations.all { expectation ->\n"
          end_marker = "\n    private fun sameCreationPayload("
          if runtime.count(start_marker) != 1 or runtime.count(end_marker) != 1:
              raise SystemExit("ExecutionRuntimeRepositoryComponent.kt target boundaries are not unique")
          start = runtime.index(start_marker)
          end = runtime.index(end_marker, start)
          replacement = '''        val snapshotPayloadValid =
              allMaterialValid && allPersonalValid &&
                  materialKeys.distinct().size == materialKeys.size &&
                  personalKeys.distinct().size == personalKeys.size &&
                  expectedUnique && expectedCountMatches
          if (!snapshotPayloadValid) {
              return RepositoryError.ConstraintViolation(
                  "create_execution_runtime",
                  ContextValidationError.USAGE_SNAPSHOT_CONFLICT.code,
              )
          }

          val currentSourcesMatch = command.contextUsage.sourceExpectations.all { expectation ->
              when (expectation.sourceType) {
                  ContextSourceType.MATERIAL -> getMaterialReference(expectation.sourceId)?.let { source ->
                      source.lifecycleState == ContextSourceLifecycle.ACTIVE &&
                          source.updatedAt == expectation.expectedUpdatedAt &&
                          source.contentHash == expectation.expectedContentHash
                  } ?: false
                  ContextSourceType.PERSONAL_CONTEXT ->
                      getPersonalContextEntry(expectation.sourceId)?.let { source ->
                          source.lifecycleState == ContextSourceLifecycle.ACTIVE &&
                              source.updatedAt == expectation.expectedUpdatedAt &&
                              source.contentHash == expectation.expectedContentHash
                      } ?: false
              }
          }
          return if (currentSourcesMatch) {
              null
          } else {
              RepositoryError.InvalidState(
                  "create_execution_runtime",
                  ContextValidationError.SOURCE_STALE.code,
              )
          }
      }
          '''
          runtime_path.write_text(runtime[:start] + replacement + runtime[end:], encoding="utf-8")

          migration_path = Path("app/src/androidTest/java/com/elio/jianyu/data/ResourceLifecycleMigrationTest.kt")
          migration = migration_path.read_text(encoding="utf-8")
          old_name = "fun allMigrationsRemainContinuousFromVersion1ToVersion8()"
          old_pairs = "listOf(1 to 2, 2 to 3, 3 to 4, 4 to 5, 5 to 6, 6 to 7, 7 to 8)"
          if migration.count(old_name) != 1 or migration.count(old_pairs) != 1:
              raise SystemExit("ResourceLifecycleMigrationTest.kt target values are not unique")
          migration = migration.replace(
              old_name,
              "fun allMigrationsRemainContinuousFromVersion1ToVersion9()",
              1,
          ).replace(
              old_pairs,
              "listOf(1 to 2, 2 to 3, 3 to 4, 4 to 5, 5 to 6, 6 to 7, 7 to 8, 8 to 9)",
              1,
          )
          migration_path.write_text(migration, encoding="utf-8")
          PY

          git diff --check
          grep -q 'ContextValidationError.SOURCE_STALE.code' \
            app/src/main/java/com/elio/jianyu/data/ExecutionRuntimeRepositoryComponent.kt
          grep -q 'allMigrationsRemainContinuousFromVersion1ToVersion9' \
            app/src/androidTest/java/com/elio/jianyu/data/ResourceLifecycleMigrationTest.kt

      - name: Compile and run JVM regression
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew \
            :app:compileDebugKotlin \
            :app:compileDebugAndroidTestKotlin \
            :app:testDebugUnitTest \
            --no-daemon --stacktrace

      - name: Commit fixes and remove temporary files
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/pr09-09-instrumentation-fix.yml \
            .github/workflows/pr09-09-instrumentation-fix-v2.yml \
            .github/workflows/pr09-09-instrumentation-fix-v3.yml \
            .github/pr09-09-fix.ready
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: 修复上下文陈旧错误与v9迁移守卫"
          git push origin HEAD:feat/pr-09-09-material-context-source
