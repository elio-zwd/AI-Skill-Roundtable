name: Secret scan

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: secret-scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan tracked files and reachable history
        shell: pwsh
        run: ./tools/check-secrets.ps1 -IncludeHistory

  commit-pr09-08-schema:
    if: github.event_name == 'push' && github.ref == 'refs/heads/feat/pr-09-08-directed-cross-discussion'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout development branch
        uses: actions/checkout@v4
        with:
          ref: feat/pr-09-08-directed-cross-discussion
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore, verify and commit Room v10 Schema
        shell: bash
        run: |
          set -euo pipefail
          schema='app/schemas/com.elio.jianyu.data.RoundtableDatabase/10.json'
          if [[ -f "$schema" ]]; then
            echo 'Room v10 Schema 已存在，不重复提交。'
            exit 0
          fi
          mkdir -p "$(dirname "$schema")"
          cat > /tmp/schema10.b64 <<'EOF'

EOF
          base64 -d /tmp/schema10.b64 | gzip -dc > "$schema"
          actual_sha="$(sha256sum "$schema" | awk '{print $1}')"
          test "$actual_sha" = 'e54ae2a9444ad0ef8ce4dc0555f6663fbbf6ed877c53a7cef3736a756e369550'
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('app/schemas/com.elio.jianyu.data.RoundtableDatabase/10.json').read_text(encoding='utf-8'))
          assert data['formatVersion'] == 1
          assert data['database']['version'] == 10
          assert data['database']['identityHash'] == '1fc8f732dc73059d38077e9f2f953b89'
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$schema"
          git diff --cached --check
          git commit -m 'feat: 提交Room v10 Schema'
          git push origin HEAD:feat/pr-09-08-directed-cross-discussion
