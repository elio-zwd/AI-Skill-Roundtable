name: PR09 AndroidTest Compile

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true

      - name: Compile AndroidTest Kotlin
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :app:compileDebugAndroidTestKotlin --no-daemon --stacktrace

      - name: Remove temporary workflow and commit evidence
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/pr09-androidtest-compile.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/pr09-androidtest-compile.yml
          git diff --cached --check
          git commit -m "test: 验证资料背景设备测试可编译"
          git push origin "HEAD:${{ github.head_ref }}"
