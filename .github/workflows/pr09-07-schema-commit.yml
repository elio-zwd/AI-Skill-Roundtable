name: PR09-07 Room Schema Commit

on:
  push:
    branches:
      - feat/pr-09-07-execution-run
    paths:
      - .github/workflows/pr09-07-schema-commit.yml

permissions:
  actions: read
  contents: write

jobs:
  commit-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: feat/pr-09-07-execution-run
          fetch-depth: 0

      - name: Download schema generated by Android CI run 341
        uses: actions/download-artifact@v4
        with:
          name: room-schema-1
          path: ${{ runner.temp }}/room-schema
          github-token: ${{ github.token }}
          repository: elio-zwd/AI-Skill-Roundtable
          run-id: 30867778512

      - name: Verify and commit Room v8 schema
        shell: bash
        run: |
          set -euo pipefail
          source_schema="${RUNNER_TEMP}/room-schema/com.elio.jianyu.data.RoundtableDatabase/8.json"
          target_schema="app/schemas/com.elio.jianyu.data.RoundtableDatabase/8.json"
          test -f "${source_schema}"
          actual_sha="$(sha256sum "${source_schema}" | awk '{print $1}')"
          expected_sha="a426e6635e6996b8605573de71a075629810dfb7e193354c7f80eac968919f72"
          test "${actual_sha}" = "${expected_sha}"
          python3 - "${source_schema}" <<'PY'
          import json
          import sys
          from pathlib import Path
          schema = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          assert schema["database"]["version"] == 8
          assert schema["database"]["identityHash"] == "abf8f4df199cbed578f1ca72a40b0232"
          PY
          mkdir -p "$(dirname "${target_schema}")"
          cp "${source_schema}" "${target_schema}"
          git add "${target_schema}"
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: 提交 Room v8 Schema"
          git push origin HEAD:feat/pr-09-07-execution-run
