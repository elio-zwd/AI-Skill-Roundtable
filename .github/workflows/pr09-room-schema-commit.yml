name: PR09 Room Schema Commit

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  schema:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true

      - name: Generate Room v9 schema
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :app:compileDebugKotlin --no-daemon
          schema=app/schemas/com.elio.jianyu.data.RoundtableDatabase/9.json
          test -s "$schema"
          grep -q '"version": 9' "$schema"
          sha256sum "$schema"

      - name: Commit generated schema
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/pr09-room-schema-commit.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/schemas/com.elio.jianyu.data.RoundtableDatabase/9.json .github/workflows/pr09-room-schema-commit.yml
          git diff --cached --check
          git commit -m "feat: 提交资料背景Room v9 Schema"
          git push origin "HEAD:${{ github.head_ref }}"
