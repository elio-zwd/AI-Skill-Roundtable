name: PR09-02B Room Schema Export

on:
  push:
    branches:
      - feat/pr-09-02b-resource-lifecycle-schema

permissions:
  contents: write

concurrency:
  group: pr09-02b-room-schema-export
  cancel-in-progress: true

jobs:
  export-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/pr-09-02b-resource-lifecycle-schema

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Room schema
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew compileDebugKotlin --stacktrace

      - name: Commit generated v7 schema when absent
        shell: bash
        run: |
          schema='app/schemas/com.elio.jianyu.data.RoundtableDatabase/7.json'
          test -f "$schema"
          git add "$schema"
          if git diff --cached --quiet; then
            echo 'Room v7 schema is already committed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: 提交真实Room v7 Schema'
          git push origin HEAD:feat/pr-09-02b-resource-lifecycle-schema
