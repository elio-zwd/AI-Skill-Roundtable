name: PR09-08 Generate Room v10 Schema

on:
  push:
    branches:
      - feat/pr-09-08-directed-cross-discussion
    paths:
      - .github/workflows/pr-09-08-generate-room-v10-schema.yml

permissions:
  contents: write

jobs:
  generate-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout latest branch
        uses: actions/checkout@v4
        with:
          ref: feat/pr-09-08-directed-cross-discussion
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Room schema
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:clean :app:compileDebugKotlin --stacktrace
          schema='app/schemas/com.elio.jianyu.data.RoundtableDatabase/10.json'
          test -s "$schema"
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('app/schemas/com.elio.jianyu.data.RoundtableDatabase/10.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          assert data['formatVersion'] == 1
          assert data['database']['version'] == 10
          print(data['database']['identityHash'])
          PY

      - name: Commit generated schema
        shell: bash
        run: |
          set -euo pipefail
          branch='feat/pr-09-08-directed-cross-discussion'
          schema='app/schemas/com.elio.jianyu.data.RoundtableDatabase/10.json'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$schema"
          git diff --cached --check
          git commit -m 'feat: 提交Room v10 Schema'
          git fetch origin "$branch"
          git rebase "origin/$branch"
          git push origin HEAD:"$branch"
