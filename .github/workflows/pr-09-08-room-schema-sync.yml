name: PR09-08 Room v10 Schema Sync

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
    paths:
      - .github/workflows/pr-09-08-room-schema-sync.yml
      - app/src/main/java/com/elio/jianyu/data/**
      - app/src/main/java/com/elio/jianyu/execution/**
      - app/build.gradle.kts

permissions:
  contents: write

jobs:
  sync-room-schema:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/pr-09-08-directed-cross-discussion'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout PR09-08 head branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Room v10 schema through compilation
        run: |
          chmod +x ./gradlew
          ./gradlew :app:compileDebugKotlin --stacktrace

      - name: Verify and commit generated schema
        shell: bash
        run: |
          set -euo pipefail
          branch='${{ github.event.pull_request.head.ref }}'
          schema='app/schemas/com.elio.jianyu.data.RoundtableDatabase/10.json'
          test -s "$schema"
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('app/schemas/com.elio.jianyu.data.RoundtableDatabase/10.json')
          payload = json.loads(path.read_text(encoding='utf-8'))
          assert payload['database']['version'] == 10
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$schema"
          if git diff --cached --quiet; then
            echo 'Room v10 schema is already current.'
            exit 0
          fi
          git commit -m 'feat: 提交Room编译生成的v10 Schema'
          git fetch origin "$branch"
          git rebase "origin/$branch"
          git push origin HEAD:"$branch"
