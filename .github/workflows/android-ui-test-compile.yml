name: Android UI Test Compile

on:
  pull_request:
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - ".github/workflows/android-ui-test-compile.yml"
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - ".github/workflows/android-ui-test-compile.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ui-test-compile-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-test-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          validate-wrappers: true

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Compile debug AndroidTest APK
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebugAndroidTest

      - name: Upload debug AndroidTest APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-android-test-apk-${{ github.run_attempt }}
          path: app/build/outputs/apk/androidTest/debug/*.apk
          if-no-files-found: ignore
          retention-days: 7
