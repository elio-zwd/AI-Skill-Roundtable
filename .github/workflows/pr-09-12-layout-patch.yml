name: PR09-12 Lifecycle Layout Patch

on:
  push:
    branches:
      - feat/pr-09-12-archive-trash
    paths:
      - .github/workflows/pr-09-12-layout-patch.yml

permissions:
  contents: write

jobs:
  patch-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: feat/pr-09-12-archive-trash
          fetch-depth: 0

      - name: Apply exact narrow-screen patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/src/main/java/com/elio/jianyu/ui/screens/issues/IssuesRoute.kt')
          text = path.read_text(encoding='utf-8')
          old_import = 'import androidx.compose.foundation.layout.Row\n'
          old_block = '''            Row(
              modifier = Modifier.fillMaxWidth(),
              horizontalArrangement = Arrangement.spacedBy(4.dp),
            ) {
          '''
          if old_import not in text:
              raise SystemExit('Expected Row import not found')
          if text.count(old_block) != 1:
              raise SystemExit(f'Expected exactly one lifecycle action Row, found {text.count(old_block)}')
          text = text.replace(old_import, '', 1)
          text = text.replace(
              old_block,
              '''            Column(
              modifier = Modifier.fillMaxWidth(),
              verticalArrangement = Arrangement.spacedBy(2.dp),
            ) {
          ''',
              1,
          )
          path.write_text(text, encoding='utf-8')
          PY
          git diff --check -- app/src/main/java/com/elio/jianyu/ui/screens/issues/IssuesRoute.kt

      - name: Commit only layout file
        shell: bash
        run: |
          set -euo pipefail
          target='app/src/main/java/com/elio/jianyu/ui/screens/issues/IssuesRoute.kt'
          git add -- "$target"
          changed="$(git diff --cached --name-only)"
          test "$changed" = "$target"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: 优化生命周期操作窄屏布局'
          git push origin HEAD:feat/pr-09-12-archive-trash
