name: PR09 UI Patch

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply verified UI patch
        shell: bash
        run: |
          set -euo pipefail
          subparts=(.github/pr09-ui.patch.gz.b64.part-00-00 .github/pr09-ui.patch.gz.b64.part-00-01 .github/pr09-ui.patch.gz.b64.part-00-02 .github/pr09-ui.patch.gz.b64.part-00-03 .github/pr09-ui.patch.gz.b64.part-00-04 .github/pr09-ui.patch.gz.b64.part-00-05)
          required=("${subparts[@]}" .github/pr09-ui.patch.gz.b64.part-01 .github/pr09-ui.patch.gz.b64.part-02 .github/pr09-ui.patch.ready)
          for file in "${required[@]}"; do
            [[ -f "$file" ]] || { echo "Missing $file"; exit 1; }
          done
          cat "${subparts[@]}" .github/pr09-ui.patch.gz.b64.part-01 .github/pr09-ui.patch.gz.b64.part-02 > /tmp/pr09-ui.patch.gz.b64
          echo "034745a151ea87856ea18d1933a7e254faef4d6c27ac85cd3a386cd4c1449e1f  /tmp/pr09-ui.patch.gz.b64" | sha256sum --check
          base64 --decode /tmp/pr09-ui.patch.gz.b64 | gzip --decompress > /tmp/pr09-ui.patch
          echo "104dda9f25a9e5c4823fd8cac3d13825a3bc776bde9ab37b256ed01a250d777a  /tmp/pr09-ui.patch" | sha256sum --check
          git apply --check /tmp/pr09-ui.patch
          git apply /tmp/pr09-ui.patch
          rm -f .github/pr09-ui.patch.gz.b64.part-00 .github/pr09-ui.patch.gz.b64.part-00-* .github/pr09-ui.patch.gz.b64.part-01 .github/pr09-ui.patch.gz.b64.part-02 .github/pr09-ui.patch.ready .github/workflows/pr09-ui-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: 接入资料背景管理与上下文确认页面"
          git push origin "HEAD:${{ github.head_ref }}"
