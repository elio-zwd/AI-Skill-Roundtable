<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>见域 · PR09-16A 交互式设计原型</title>
  <style>
    :root {
      --canvas: #f8fafc;
      --surface: #ffffff;
      --surface-2: #f1f5f9;
      --surface-3: #eef2ff;
      --text: #111827;
      --text-2: #475569;
      --border: #cbd5e1;
      --brand: #4f46e5;
      --brand-strong: #4338ca;
      --on-brand: #ffffff;
      --practical: #0f766e;
      --practical-bg: #ccfbf1;
      --perspective: #6d28d9;
      --perspective-bg: #f3e8ff;
      --success: #047857;
      --success-bg: #d1fae5;
      --warning: #a15c00;
      --warning-bg: #fef3c7;
      --danger: #b42318;
      --danger-bg: #fee4e2;
      --info: #1d4ed8;
      --info-bg: #dbeafe;
      --shadow: 0 18px 42px rgba(15, 23, 42, .10);
      --font-scale: 1;
    }

    [data-theme="dark"] {
      --canvas: #10131a;
      --surface: #171b24;
      --surface-2: #1e2430;
      --surface-3: #29285a;
      --text: #f8fafc;
      --text-2: #cbd5e1;
      --border: #334155;
      --brand: #a5b4fc;
      --brand-strong: #c7d2fe;
      --on-brand: #10131a;
      --practical: #5eead4;
      --practical-bg: #123e3a;
      --perspective: #c4b5fd;
      --perspective-bg: #39245e;
      --success: #5eead4;
      --success-bg: #123e3a;
      --warning: #fbbf24;
      --warning-bg: #4a3411;
      --danger: #fda4af;
      --danger-bg: #4b2025;
      --info: #93c5fd;
      --info-bg: #18315a;
      --shadow: 0 18px 42px rgba(0, 0, 0, .28);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-width: 320px;
      background: var(--canvas);
      color: var(--text);
      font-family: Roboto, "Noto Sans CJK SC", "Microsoft YaHei UI", sans-serif;
      font-size: calc(16px * var(--font-scale));
      line-height: 1.5;
    }

    button, select, input, textarea { font: inherit; }
    button, select { cursor: pointer; }
    button:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible {
      outline: 3px solid var(--brand);
      outline-offset: 2px;
    }

    .prototype-shell {
      display: grid;
      grid-template-columns: 280px minmax(0, 1fr);
      min-height: 100vh;
    }

    .control-panel {
      position: sticky;
      top: 0;
      height: 100vh;
      overflow: auto;
      padding: 24px 16px;
      border-right: 1px solid var(--border);
      background: var(--surface);
    }

    .brand-lockup { display: flex; align-items: center; gap: 12px; margin: 0 8px 24px; }
    .open-window {
      width: 34px;
      height: 34px;
      border: 3px solid var(--brand);
      border-right-color: transparent;
      border-radius: 9px 2px 2px 9px;
      position: relative;
      flex: 0 0 auto;
    }
    .open-window::after {
      content: "";
      position: absolute;
      width: 12px;
      height: 3px;
      right: -5px;
      top: 13px;
      background: var(--brand);
      border-radius: 99px;
    }
    .brand-lockup strong { font-size: 20px; letter-spacing: .02em; }
    .brand-lockup small { display: block; color: var(--text-2); font-size: 12px; }

    .panel-label {
      display: block;
      margin: 18px 8px 8px;
      color: var(--text-2);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .control-panel select, .control-panel input[type="range"] {
      width: calc(100% - 16px);
      margin: 0 8px;
    }
    .control-panel select {
      min-height: 44px;
      padding: 0 10px;
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      background: var(--surface-2);
    }

    .switch-row, .small-note {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 10px 8px;
      color: var(--text-2);
      font-size: 13px;
    }
    .small-note { align-items: flex-start; }
    .switch-row input { width: 18px; height: 18px; }

    .nav-list { display: grid; gap: 4px; }
    .nav-item {
      display: flex;
      align-items: center;
      width: 100%;
      min-height: 44px;
      padding: 10px 12px;
      border: 0;
      border-radius: 10px;
      background: transparent;
      color: var(--text);
      text-align: left;
    }
    .nav-item:hover { background: var(--surface-2); }
    .nav-item.active { background: var(--surface-3); color: var(--brand-strong); font-weight: 700; }

    .workbench {
      min-width: 0;
      padding: 28px;
      display: grid;
      place-items: start center;
      gap: 14px;
    }
    .prototype-caption { width: min(100%, 900px); color: var(--text-2); font-size: 13px; }

    .device {
      width: min(100%, 412px);
      height: min(820px, calc(100vh - 86px));
      min-height: 620px;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 28px;
      background: var(--canvas);
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
    }
    .status-strip {
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 30px;
      padding: 0 18px;
      color: var(--text-2);
      font-size: 11px;
      font-weight: 700;
      background: var(--surface);
    }
    .app-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 60px;
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
      background: color-mix(in srgb, var(--surface) 94%, transparent);
    }
    .app-topbar h1 { margin: 0; font-size: 18px; line-height: 1.25; }
    .app-topbar .sub { color: var(--text-2); font-size: 12px; }
    .icon-button {
      display: inline-grid;
      place-items: center;
      width: 44px;
      height: 44px;
      border: 1px solid var(--border);
      border-radius: 22px;
      color: var(--text);
      background: var(--surface);
      font-size: 19px;
    }

    .screen {
      min-height: 0;
      flex: 1 1 auto;
      overflow-y: auto;
      padding: 16px;
      overscroll-behavior: contain;
    }
    .screen > * + * { margin-top: 16px; }

    .state-banner {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--surface-2);
      color: var(--text);
      font-size: 13px;
    }
    .state-banner strong { display: block; }
    .state-banner p { margin: 2px 0 0; color: var(--text-2); }
    .state-banner[data-tone="success"] { border-color: var(--success); background: var(--success-bg); }
    .state-banner[data-tone="warning"] { border-color: var(--warning); background: var(--warning-bg); }
    .state-banner[data-tone="danger"] { border-color: var(--danger); background: var(--danger-bg); }
    .state-banner[data-tone="info"] { border-color: var(--info); background: var(--info-bg); }
    .state-symbol { width: 20px; height: 20px; font-weight: 900; text-align: center; flex: 0 0 auto; }

    .eyebrow, .section-title {
      color: var(--text-2);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .04em;
    }
    .page-title { margin: 0; font-size: 26px; letter-spacing: -.03em; line-height: 1.25; }
    .page-copy { margin: 6px 0 0; color: var(--text-2); font-size: 14px; }

    .card {
      padding: 16px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--surface);
    }
    .card > *:first-child { margin-top: 0; }
    .card > *:last-child { margin-bottom: 0; }
    .card h2, .card h3 { margin: 0 0 4px; font-size: 16px; line-height: 1.35; }
    .card p { margin: 4px 0; color: var(--text-2); font-size: 13px; }

    .input-label { display: block; margin-bottom: 8px; font-size: 14px; font-weight: 700; }
    .question-input, .text-input {
      width: 100%;
      min-height: 56px;
      resize: vertical;
      padding: 13px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--surface);
      color: var(--text);
      line-height: 1.45;
    }
    .helper { display: block; margin-top: 7px; color: var(--text-2); font-size: 12px; }

    .direction-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .direction {
      min-height: 116px;
      padding: 14px;
      border: 1px solid var(--border);
      border-radius: 16px;
      color: var(--text);
      background: var(--surface);
      text-align: left;
    }
    .direction strong, .direction small { display: block; }
    .direction small { margin-top: 5px; color: var(--text-2); }
    .direction[data-direction="practical"].selected { border: 2px solid var(--practical); background: var(--practical-bg); }
    .direction[data-direction="perspective"].selected { border: 2px solid var(--perspective); background: var(--perspective-bg); }

    .button-row { display: flex; flex-wrap: wrap; gap: 8px; }
    .button {
      min-height: 48px;
      padding: 10px 16px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--surface);
      color: var(--text);
      font-weight: 700;
    }
    .button.primary { border-color: var(--brand); background: var(--brand); color: var(--on-brand); }
    .button.danger { border-color: var(--danger); color: var(--danger); }
    .button[disabled] { cursor: not-allowed; opacity: .55; }

    .chip-row { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip {
      display: inline-flex;
      align-items: center;
      min-height: 28px;
      padding: 3px 9px;
      border: 1px solid var(--border);
      border-radius: 99px;
      color: var(--text-2);
      background: var(--surface-2);
      font-size: 12px;
      font-weight: 700;
    }
    .chip.practical { border-color: var(--practical); color: var(--practical); background: var(--practical-bg); }
    .chip.perspective { border-color: var(--perspective); color: var(--perspective); background: var(--perspective-bg); }
    .chip.warning { border-color: var(--warning); color: var(--warning); background: var(--warning-bg); }
    .chip.success { border-color: var(--success); color: var(--success); background: var(--success-bg); }

    .list-row {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 12px 0;
      border-top: 1px solid var(--border);
    }
    .list-row:first-of-type { border-top: 0; }
    .avatar {
      display: grid;
      place-items: center;
      width: 36px;
      height: 36px;
      border-radius: 12px;
      color: var(--brand-strong);
      background: var(--surface-3);
      font-weight: 900;
      flex: 0 0 auto;
    }
    .list-grow { min-width: 0; flex: 1; }
    .list-grow strong { display: block; font-size: 14px; }
    .list-grow span { display: block; color: var(--text-2); font-size: 12px; }

    .timeline { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 3px; }
    .stage-pill {
      min-width: 120px;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text-2);
      background: var(--surface);
      font-size: 12px;
    }
    .stage-pill.current { border-color: var(--brand); background: var(--surface-3); color: var(--brand-strong); font-weight: 700; }

    .mode-tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
    .mode-tabs button {
      min-height: 42px;
      padding: 6px;
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text-2);
      background: var(--surface);
      font-size: 12px;
      font-weight: 700;
    }
    .mode-tabs button.active { border-color: var(--brand); color: var(--brand-strong); background: var(--surface-3); }

    .response-card {
      padding: 14px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--surface);
    }
    .response-head { display: flex; align-items: center; gap: 9px; }
    .response-head > div { min-width: 0; flex: 1; }
    .response-head strong { display: block; font-size: 14px; }
    .response-head span { color: var(--text-2); font-size: 12px; }
    .response-card p { margin: 12px 0; color: var(--text); font-size: 14px; }
    .response-actions { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .text-action {
      min-height: 36px;
      padding: 5px 8px;
      border: 0;
      border-radius: 8px;
      color: var(--brand-strong);
      background: transparent;
      font-weight: 700;
    }

    .workspace-context {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 38px;
      overflow-x: auto;
      color: var(--text-2);
      font-size: 12px;
      white-space: nowrap;
    }
    .workspace-context button {
      min-height: 34px;
      padding: 5px 9px;
      border: 1px solid var(--border);
      border-radius: 99px;
      color: var(--text-2);
      background: var(--surface);
      font-weight: 700;
    }
    .chat-rail {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      min-height: 40px;
      padding: 7px 10px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface-2);
      color: var(--text-2);
      font-size: 12px;
    }
    .chat-rail[data-tone="warning"] { border-color: var(--warning); background: var(--warning-bg); color: var(--warning); }
    .chat-rail[data-tone="danger"] { border-color: var(--danger); background: var(--danger-bg); color: var(--danger); }
    .chat-rail[data-tone="info"] { border-color: var(--info); background: var(--info-bg); color: var(--info); }
    .chat-rail > span:first-child { min-width: 0; }
    .rail-actions { display: inline-flex; align-items: center; gap: 3px; flex: 0 0 auto; }
    .rail-actions .text-action { min-height: 30px; padding: 3px 6px; font-size: 12px; }

    .chat-stream { display: grid; gap: 18px; }
    .chat-message {
      display: grid;
      grid-template-columns: 36px minmax(0, 1fr);
      gap: 9px;
      align-items: start;
    }
    .chat-message.user { grid-template-columns: minmax(0, 1fr) 36px; }
    .chat-message.user .avatar { grid-column: 2; }
    .chat-message.user .message-stack { grid-column: 1; grid-row: 1; justify-self: end; max-width: 88%; }
    .message-stack { min-width: 0; }
    .message-meta {
      display: flex;
      align-items: center;
      gap: 6px;
      min-height: 22px;
      margin: 0 0 5px;
      font-size: 12px;
    }
    .message-meta strong { color: var(--text); }
    .message-meta span { color: var(--text-2); }
    .message-bubble {
      padding: 12px 13px;
      border: 1px solid var(--border);
      border-radius: 4px 16px 16px 16px;
      background: var(--surface);
      color: var(--text);
      font-size: 14px;
      line-height: 1.62;
    }
    .chat-message.user .message-bubble {
      border-color: var(--brand);
      border-radius: 16px 4px 16px 16px;
      background: var(--surface-3);
    }
    .message-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-top: 5px;
      color: var(--text-2);
      font-size: 11px;
    }
    .message-footer .text-action { min-height: 28px; padding: 2px 5px; font-size: 12px; }
    .conversation-divider {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-2);
      font-size: 11px;
      font-weight: 700;
    }
    .conversation-divider::before, .conversation-divider::after {
      content: "";
      height: 1px;
      flex: 1;
      background: var(--border);
    }
    .workspace-menu {
      display: grid;
      gap: 4px;
      margin-bottom: 12px;
      padding: 8px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--surface);
      box-shadow: 0 10px 24px rgba(15, 23, 42, .12);
    }
    .workspace-menu button {
      min-height: 44px;
      padding: 8px 10px;
      border: 0;
      border-radius: 9px;
      color: var(--text);
      background: transparent;
      text-align: left;
      font-weight: 700;
    }
    .workspace-menu button:hover { background: var(--surface-2); }
    .workspace-menu button.danger { color: var(--danger); }

    .composer-actions {
      display: none;
      gap: 6px;
      padding: 0 0 8px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 8px;
    }
    .composer-actions.open { display: flex; }
    .composer-actions button {
      min-height: 36px;
      padding: 5px 9px;
      border: 1px solid var(--border);
      border-radius: 9px;
      color: var(--text);
      background: var(--surface-2);
      font-size: 12px;
      font-weight: 700;
    }
    .composer-context {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin: 0 2px 6px;
      color: var(--text-2);
      font-size: 11px;
    }
    .composer-row {
      display: grid;
      grid-template-columns: 42px minmax(0, 1fr) 46px;
      align-items: end;
      gap: 6px;
    }
    .composer-row textarea {
      min-height: 46px;
      max-height: 116px;
      padding: 11px 10px;
      border: 1px solid var(--border);
      border-radius: 15px;
      color: var(--text);
      background: var(--surface-2);
      line-height: 1.35;
      resize: none;
    }
    .composer-icon {
      display: inline-grid;
      place-items: center;
      width: 42px;
      height: 42px;
      border: 1px solid var(--border);
      border-radius: 13px;
      color: var(--text);
      background: var(--surface);
      font-size: 21px;
      font-weight: 700;
    }
    .composer-send {
      display: inline-grid;
      place-items: center;
      width: 46px;
      height: 46px;
      border: 0;
      border-radius: 14px;
      color: var(--on-brand);
      background: var(--brand);
      font-size: 20px;
      font-weight: 900;
    }

    .converging-lines {
      display: inline-flex;
      gap: 3px;
      align-items: center;
      width: 24px;
      height: 20px;
    }
    .converging-lines i {
      display: block;
      width: 3px;
      height: 14px;
      border-radius: 99px;
      background: var(--brand);
      transform: skewX(-22deg);
      animation: converge 1.08s ease-in-out infinite;
    }
    .converging-lines i:nth-child(2) { height: 18px; animation-delay: .16s; }
    .converging-lines i:nth-child(3) { animation-delay: .32s; }
    @keyframes converge {
      0%, 100% { opacity: .35; transform: skewX(-22deg) translateY(2px); }
      50% { opacity: 1; transform: skewX(-22deg) translateY(-2px); }
    }
    [data-reduced-motion="true"] .converging-lines i { animation: none; opacity: .9; transform: none; }

    .stepper { display: flex; gap: 5px; }
    .step {
      flex: 1;
      min-height: 36px;
      padding: 7px 4px;
      border: 1px solid var(--border);
      border-radius: 9px;
      color: var(--text-2);
      background: var(--surface);
      font-size: 11px;
      text-align: center;
      font-weight: 700;
    }
    .step.active { color: var(--brand-strong); border-color: var(--brand); background: var(--surface-3); }
    .metric { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .metric div { padding: 10px; border-radius: 12px; background: var(--surface-2); }
    .metric strong, .metric span { display: block; }
    .metric strong { font-size: 19px; }
    .metric span { color: var(--text-2); font-size: 12px; }

    .empty-state { padding: 30px 16px; text-align: center; }
    .empty-mark { width: 52px; height: 52px; margin: 0 auto 12px; border: 2px dashed var(--border); border-radius: 16px; }
    .skeleton { overflow: hidden; border-radius: 10px; background: var(--surface-2); height: 18px; }
    .skeleton::after { content: ""; display: block; width: 48%; height: 100%; background: color-mix(in srgb, var(--surface) 72%, transparent); animation: shimmer 1.3s infinite; }
    .skeleton.wide { height: 92px; }
    @keyframes shimmer { from { transform: translateX(-120%); } to { transform: translateX(280%); } }
    [data-reduced-motion="true"] .skeleton::after { animation: none; }

    .bottom-nav {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      flex: 0 0 70px;
      min-height: 70px;
      padding: 5px 4px 8px;
      border-top: 1px solid var(--border);
      background: color-mix(in srgb, var(--surface) 96%, transparent);
    }
    .workspace-composer {
      display: none;
      flex: 0 0 auto;
      padding: 8px 12px 12px;
      border-top: 1px solid var(--border);
      background: var(--surface);
    }
    .device.chat-mode .workspace-composer { display: block; }
    .device.chat-mode .bottom-nav { display: none; }
    .bottom-nav button {
      min-height: 54px;
      border: 0;
      border-radius: 10px;
      color: var(--text-2);
      background: transparent;
      font-size: 11px;
      font-weight: 700;
    }
    .bottom-nav button.active { color: var(--brand-strong); background: var(--surface-3); }

    @media (max-width: 760px) {
      .prototype-shell { grid-template-columns: 1fr; }
      .control-panel { position: static; height: auto; padding: 16px; border-right: 0; border-bottom: 1px solid var(--border); }
      .nav-list { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .nav-item { justify-content: center; text-align: center; font-size: 12px; }
      .workbench { padding: 16px 0; }
      .prototype-caption { padding: 0 16px; }
      .device { border-right: 0; border-left: 0; border-radius: 0; }
    }
  </style>
</head>
<body>
  <main class="prototype-shell" aria-label="见域 PR09-16A 交互式设计原型">
    <aside class="control-panel" aria-label="原型控制面板">
      <div class="brand-lockup">
        <span class="open-window" aria-hidden="true"></span>
        <div><strong>见域</strong><small>UI/UX 设计冻结 · 原型</small></div>
      </div>

      <label class="panel-label" for="prototype-state">全局状态</label>
      <select id="prototype-state" aria-label="选择页面状态">
        <option value="Content">Content</option>
        <option value="Empty">Empty</option>
        <option value="Loading">Loading</option>
        <option value="Running">Running</option>
        <option value="Partial Success">Partial Success</option>
        <option value="Failure">Failure</option>
        <option value="Offline">Offline</option>
        <option value="No API Key">No API Key</option>
        <option value="Rate Limited">Rate Limited</option>
        <option value="Canceled">Canceled</option>
        <option value="Stopped">Stopped</option>
        <option value="Recovering">Recovering</option>
        <option value="Restored">Restored</option>
        <option value="Unavailable">Unavailable</option>
      </select>

      <label class="panel-label" for="font-scale">字号比例</label>
      <input id="font-scale" type="range" min="1" max="2" step=".1" value="1" aria-label="字号比例">
      <div class="small-note"><span id="font-scale-value">100%</span><span>请检查按钮换行与纵向滚动。</span></div>

      <label class="switch-row"><input id="dark-toggle" type="checkbox"><span>暗色主题</span></label>
      <label class="switch-row"><input id="motion-toggle" type="checkbox"><span>减少动效</span></label>

      <span class="panel-label">页面</span>
      <nav class="nav-list" aria-label="设计页面">
        <button class="nav-item active" data-page="launch">启动与初始化</button>
        <button class="nav-item" data-page="home">首页问题输入</button>
        <button class="nav-item" data-page="recommend">推荐与阵容</button>
        <button class="nav-item" data-page="context">资料与背景确认</button>
        <button class="nav-item" data-page="workspace">议题执行工作区</button>
        <button class="nav-item" data-page="result">草稿与正式成果</button>
        <button class="nav-item" data-page="advance">推进议题</button>
        <button class="nav-item" data-page="issues">议题与回收站</button>
        <button class="nav-item" data-page="resources">资料与成果库</button>
        <button class="nav-item" data-page="skills">Skill 目录</button>
        <button class="nav-item" data-page="settings">设置与 API Key</button>
      </nav>
    </aside>

    <section class="workbench">
      <p class="prototype-caption">可切换 11 个核心页面与 14 个全局状态。原型只演示视觉和交互承载，不发送请求、不持久化数据，也不代表现有业务状态机。</p>
      <section class="device" aria-live="polite">
        <div class="status-strip"><span>9:41</span><span>● ● ●</span></div>
        <header class="app-topbar">
          <div><h1 id="screen-name">启动与初始化</h1><span class="sub" id="screen-subtitle">见域 · 看见更多观点</span></div>
          <button id="topbar-action" class="icon-button" aria-label="打开设置" data-page="settings">○</button>
        </header>
        <div class="screen" id="screen-content"></div>
        <section id="workspace-composer" class="workspace-composer" aria-label="继续当前阶段"></section>
        <nav class="bottom-nav" aria-label="底部导航">
          <button data-page="home">首页</button>
          <button data-page="issues">议题</button>
          <button data-page="skills">Skill</button>
          <button data-page="resources">资料与成果</button>
        </nav>
      </section>
    </section>
  </main>

  <script>
    (function () {
      var state = "Content";
      var page = "launch";
      var workspaceMode = "independent";
      var advanceStep = 1;
      var selectedDirections = { practical: true, perspective: true };
      var workspaceMenuOpen = false;
      var composerMenuOpen = false;

      var labels = {
        launch: ["启动与初始化", "见域 · 看见更多观点"],
        home: ["首页", "从一个问题开始"],
        recommend: ["Skill 推荐", "选择有理由的阵容"],
        context: ["确认本次上下文", "资料与个人背景"],
        workspace: ["机器人嵌入式转向", "阶段 1 · 明确目标与约束"],
        result: ["阶段草稿", "阶段 1 · 尚未确认成果"],
        advance: ["推进议题", "创建下一阶段"],
        issues: ["议题", "进行中 · 已归档 · 回收站"],
        resources: ["资料与成果", "来源、背景与可交付成果"],
        skills: ["Skill 目录", "寻找适合此刻的能力"],
        settings: ["设置", "模型、可访问性与数据"]
      };

      var stateData = {
        "Content": ["info", "内容可用", "这是内容状态。主任务、筛选和局部操作都可用。", "i"],
        "Empty": ["info", "还没有内容", "从一个问题、资料或 Skill 开始；不会以空白页代替指引。", "+"],
        "Loading": ["info", "正在加载", "页面布局已经保留。超过 300ms 后会说明正在等待什么。", "…"],
        "Running": ["info", "正在生成", "已完成 2/3 位 Skill。可停止，也可继续查看已完成内容。", "↗"],
        "Partial Success": ["warning", "部分完成", "2 项完成，1 项需要处理。成功内容保持可读。", "!"],
        "Failure": ["danger", "操作失败", "未能保存这次操作。编辑内容仍在这里，可重试或返回。", "×"],
        "Offline": ["warning", "当前离线", "已显示本地内容。联网操作已禁用，但本地浏览不受影响。", "⌁"],
        "No API Key": ["warning", "尚未配置可用 API Key", "可继续浏览和整理本地内容。需要模型时再前往设置。", "!" ],
        "Rate Limited": ["warning", "服务暂时限流", "系统没有重复提交请求。只显示当前策略允许的重试。", "!" ],
        "Canceled": ["info", "操作已取消", "已完成内容保留，你可以重新开始。", "–"],
        "Stopped": ["warning", "生成已停止", "部分内容已保留，并清楚标记不完整边界。", "■"],
        "Recovering": ["info", "正在恢复上一次运行", "这是恢复而非新的运行。可查看历史或取消恢复。", "↻"],
        "Restored": ["success", "已恢复", "焦点会回到已恢复对象，不会自动跳到页面开头。", "✓"],
        "Unavailable": ["danger", "当前能力不可用", "显示受影响模型或 Skill 的原因，并给出不暗中替换的下一步。", "×"]
      };

      function stateBanner() {
        if (state === "Content") {
          return "";
        }
        var item = stateData[state];
        if (state === "Loading") {
          return "<div class='state-banner' data-tone='" + item[0] + "'><span class='state-symbol'>" + item[3] + "</span><div><strong>" + item[1] + "</strong><p>" + item[2] + "</p></div></div><div class='skeleton wide'></div>";
        }
        return "<div class='state-banner' data-tone='" + item[0] + "'><span class='state-symbol'>" + item[3] + "</span><div><strong>" + item[1] + "</strong><p>" + item[2] + "</p></div></div>";
      }

      function emptyCard(label, action) {
        return "<section class='card empty-state'><div class='empty-mark' aria-hidden='true'></div><h2>" + label + "</h2><p>这里还没有内容，但已明确下一步。</p><button class='button primary'>" + action + "</button></section>";
      }

      function launchView() {
        return stateBanner() +
          "<section class='card'><div class='brand-lockup'><span class='open-window' aria-hidden='true'></span><div><strong>见域</strong><small>看见更多观点，打开认知边界</small></div></div><h2>正在准备你的本地工作区</h2><p>初始化、恢复和错误始终使用清楚文字说明，绝不以无限动画隐藏等待。</p><div class='metric'><div><strong>本地优先</strong><span>资料与成果可离线阅读</span></div><div><strong>可恢复</strong><span>中断运行会被明确标记</span></div></div></section><button class='button primary' data-page='home'>进入首页</button>";
      }

      function homeView() {
        if (state === "Empty") { return stateBanner() + emptyCard("从一个想推进的问题开始", "使用示例问题"); }
        return stateBanner() +
          "<section><p class='eyebrow'>今天想推进什么？</p><h2 class='page-title'>让不同视角，帮你看清下一步。</h2><p class='page-copy'>输入问题，选择你需要的支持方向。两种方向可以同时选择。</p></section>" +
          "<section class='card'><label class='input-label' for='question'>你想推进什么问题？</label><textarea id='question' class='question-input' rows='3'>我要不要在未来半年转向机器人嵌入式岗位？</textarea><span class='helper'>可以先保存为议题，不会自动调用模型。</span></section>" +
          "<section><span class='section-title'>这次希望获得什么？</span><div class='direction-grid'><button class='direction " + (selectedDirections.practical ? "selected" : "") + "' data-direction='practical'><strong>现实支持</strong><small>明确下一步、计划、阻碍与检查点</small></button><button class='direction " + (selectedDirections.perspective ? "selected" : "") + "' data-direction='perspective'><strong>思维拓展</strong><small>反方、假设、遗漏视角与立场比较</small></button></div></section>" +
          "<div class='button-row'><button class='button primary' data-page='recommend'" + (state === "No API Key" ? " disabled" : "") + ">" + (state === "No API Key" ? "配置 API Key 后获取建议" : "获取建议") + "</button><button class='button' data-page='issues'>仅保存议题</button></div>" +
          "<section class='card'><h2>最近议题</h2><div class='list-row'><span class='avatar'>1</span><div class='list-grow'><strong>机器人嵌入式岗位转向</strong><span>阶段 1 · 2 位 Skill 已回应</span></div><span class='chip success'>可继续</span></div></section>";
      }

      function recommendView() {
        return stateBanner() +
          "<section><p class='eyebrow'>有理由的建议</p><h2 class='page-title'>推荐一个三人阵容</h2><p class='page-copy'>你可以改为单 Skill，或调整成员与职责；系统不会替你决定。</p></section>" +
          "<section class='card'><div class='chip-row'><span class='chip practical'>现实支持</span><span class='chip perspective'>思维拓展</span><span class='chip'>多 Skill · 3 位</span></div><h2 style='margin-top:12px'>推荐理由</h2><p>职业路径需要可执行拆解、技术可行性检查和不同风险偏好三个独立视角。</p></section>" +
          "<section class='card'><div class='list-row'><span class='avatar'>职</span><div class='list-grow'><strong>职业发展顾问</strong><span>职责：梳理转向目标与可验证里程碑</span><span>推荐理由：帮助把选择转为可检验的行动计划</span></div><span class='chip success'>已选</span></div><div class='list-row'><span class='avatar'>嵌</span><div class='list-grow'><strong>嵌入式工程顾问</strong><span>职责：评估技能缺口与项目路径</span><span>适用条件：需要具体岗位与项目经验信息</span></div><span class='chip success'>已选</span></div><div class='list-row'><span class='avatar'>塔</span><div class='list-grow'><strong>塔勒布视角</strong><span>AI 模拟视角，并非本人 · 职责：挑战脆弱假设</span><span>风险：观点仅作独立视角，不代替事实核验</span></div><span class='chip success'>已选</span></div></section>" +
          "<div class='button-row'><button class='button' data-page='skills'>调整阵容</button><button class='button primary' data-page='context'>确认资料与背景</button></div>";
      }

      function contextView() {
        return stateBanner() +
          "<section><p class='eyebrow'>开始前确认</p><h2 class='page-title'>决定这次带入什么</h2><p class='page-copy'>每项都有来源、时间与敏感范围；只在本次明确确认后带入。</p></section>" +
          "<section class='card'><h2>本次资料</h2><div class='list-row'><span class='avatar'>资</span><div class='list-grow'><strong>嵌入式项目经历梳理</strong><span>个人笔记 · 更新于今天 · 本次带入</span></div><span class='chip success'>已选</span></div><div class='list-row'><span class='avatar'>链</span><div class='list-grow'><strong>目标岗位 JD 对比</strong><span>外部来源 · 采集于 2026-08-01</span></div><span class='chip success'>已选</span></div></section>" +
          "<section class='card'><h2>个人背景</h2><div class='list-row'><span class='avatar'>背</span><div class='list-grow'><strong>职业约束与时间安排</strong><span>敏感内容 · 仅本阶段使用 · 不在推荐卡预览全文</span></div><span class='chip warning'>敏感</span></div></section>" +
          "<div class='button-row'><button class='button' data-page='recommend'>返回阵容</button><button class='button primary' data-page='workspace'>确认并开始</button></div>";
      }

      function chatMessage(name, role, body, chip) {
        return "<article class='chat-message'><span class='avatar'>" + name.charAt(0) + "</span><div class='message-stack'><div class='message-meta'><strong>" + name + "</strong><span>· " + role + "</span><span class='chip'>AI 生成</span><span class='chip " + chip[1] + "'>" + chip[0] + "</span></div><div class='message-bubble'>" + body + "</div><div class='message-footer'><span>来源：本阶段 · 刚刚</span><button class='text-action'>完整回应</button></div></div></article>";
      }

      function userMessage(body) {
        return "<article class='chat-message user'><span class='avatar'>我</span><div class='message-stack'><div class='message-meta'><span>你</span></div><div class='message-bubble'>" + body + "</div><div class='message-footer'><span>已发送</span></div></div></article>";
      }

      function workspaceRail() {
        if (state === "Content") {
          return "<div class='chat-rail'><span>3 位 Skill 已回应 · 可继续追问或整理当前结论</span><button class='text-action'>查看阵容</button></div>";
        }
        if (state === "Running") {
          return "<div class='chat-rail' data-tone='info'><span><span class='converging-lines' aria-label='正在生成'><i></i><i></i><i></i></span> 正在获得第 3 位 Skill 的回应</span><span class='rail-actions'><button class='text-action'>停止</button></span></div>";
        }
        if (state === "Partial Success") {
          return "<div class='chat-rail' data-tone='warning'><span>2 位已回应，塔勒布视角需要处理</span><span class='rail-actions'><button class='text-action'>重试</button></span></div>";
        }
        if (state === "Stopped") {
          return "<div class='chat-rail' data-tone='warning'><span>生成已停止，已保留可阅读的部分回应</span><span class='rail-actions'><button class='text-action'>继续</button></span></div>";
        }
        if (state === "Recovering") {
          return "<div class='chat-rail' data-tone='info'><span>正在恢复上一次运行，不会重复提交</span><span class='rail-actions'><button class='text-action'>历史</button></span></div>";
        }
        var item = stateData[state];
        return "<div class='chat-rail' data-tone='" + item[0] + "'><span>" + item[1] + " · " + item[2] + "</span><button class='text-action'>查看</button></div>";
      }

      function workspaceMenu() {
        if (!workspaceMenuOpen) { return ""; }
        return "<section class='workspace-menu' aria-label='工作区功能'><button data-page='result'>整理阶段草稿</button><button data-page='advance'>推进议题</button><button>查看本阶段资料</button><button>查看阵容与运行历史</button><button class='danger'>停止或归档议题</button></section>";
      }

      function workspaceComposerView() {
        return "<div class='composer-actions " + (composerMenuOpen ? "open" : "") + "' aria-label='对话操作面板'><button data-mode='directed'>点名回应</button><button data-mode='cross'>发起交叉讨论</button><button>带入资料</button></div><label class='composer-context' for='workspace-input'><span>继续当前阶段</span><span>" + (workspaceMode === "directed" ? "定向给：嵌入式工程顾问" : workspaceMode === "cross" ? "本次交叉讨论" : "默认：全部 Skill") + "</span></label><div class='composer-row'><button class='composer-icon' data-composer-menu='true' aria-label='打开对话操作' aria-expanded='" + (composerMenuOpen ? "true" : "false") + "'>＋</button><textarea id='workspace-input' rows='1' placeholder='自由追问，继续这段对话。'></textarea><button class='composer-send' aria-label='发送消息'>↑</button></div>";
      }

      function workspaceView() {
        var modeContent = "";
        if (workspaceMode === "independent") {
          modeContent = userMessage("我有 Android 开发经验，想在半年内转向机器人嵌入式岗位。第一步应该怎样验证方向？") +
            chatMessage("职业发展顾问", "行动路径", "先把半年目标拆成岗位样本、能力差距、一个可展示项目和三次反馈。这样能用小实验降低一次性选择的风险。", ["已完成", "success"]) +
            chatMessage("嵌入式工程顾问", "技术可行性", "建议先用现有经验搭建一个包含传感器、RTOS 和边缘推理的最小项目，再用招聘要求补齐缺口。", ["已完成", "success"]) +
            chatMessage("塔勒布视角", "反方检查", "不要把单一行业预测当作确定性。保留回退路径，并用可转移能力衡量每一项投入。", ["需要处理", "warning"]);
        } else if (workspaceMode === "directed") {
          modeContent = "<div class='conversation-divider'>定向回应 · 结束后恢复多 Skill</div>" +
            userMessage("请根据我的现有 Android 经验，给出第一个机器人嵌入式项目的范围建议。") +
            chatMessage("嵌入式工程顾问", "定向回应", "从一个可在两周内演示的传感器采集、控制和日志闭环开始。范围应小到可以复盘，而不是直接堆完整机器人平台。", ["定向回应", "success"]);
        } else {
          modeContent = "<div class='conversation-divider'>本次交叉讨论 · 焦点：转向风险是否可控</div>" +
            chatMessage("会议行动助手", "整合本次交叉讨论，不裁决真理", "参与者中 2 位已完成、1 位需要重试。共识：先用小项目检验方向。分歧：投入节奏和机会成本。建议：两周完成项目范围，并在四周后复盘求职信号。", ["部分完成", "warning"]);
        }
        return workspaceMenu() +
          "<section class='workspace-context'><button>阶段 1 · 明确目标与约束</button><button>3 位 Skill</button><span>AI 对话工作区</span></section>" +
          workspaceRail() +
          "<section class='chat-stream'>" + modeContent + "</section>";
      }

      function resultView() {
        return stateBanner() +
          "<section><p class='eyebrow'>阶段 1</p><h2 class='page-title'>还在编辑的阶段草稿</h2><p class='page-copy'>草稿不是正式成果；确认前会持续保留可恢复的保存状态。</p></section>" +
          "<section class='card'><div class='chip-row'><span class='chip warning'>草稿</span><span class='chip success'>已保存 · 版本 3</span></div><label class='input-label' style='margin-top:14px' for='draft'>阶段总结</label><textarea id='draft' class='text-input' rows='7'>共识：先用小项目检验方向。分歧：投入节奏与机会成本。明确建议：两周完成项目范围，四周复盘岗位信号。下一步：补齐 RTOS 与传感器链路的作品集证据。</textarea><span class='helper'>来源：3 条独立回应、1 次交叉讨论。保存失败会保留这段编辑内容。</span></section>" +
          "<section class='card'><h2>保存为正式成果</h2><p>确认后将记录标题、类型、版本、所属议题/阶段和来源范围。</p><div class='button-row'><button class='button'>选择类型：行动计划</button><button class='button primary'>确认正式成果</button></div></section>";
      }

      function advanceView() {
        var body = "";
        if (advanceStep === 1) {
          body = "<section><h2 class='page-title'>选择推进方向</h2><p class='page-copy'>可以跳过、单选或组合；不会自动创建分支议题。</p></section><div class='direction-grid'><button class='direction selected' data-direction='practical'><strong>现实支持</strong><small>明确下一步、计划、执行阻碍</small></button><button class='direction' data-direction='perspective'><strong>思维拓展</strong><small>反方、假设、遗漏视角</small></button></div>";
        } else if (advanceStep === 2) {
          body = "<section><h2 class='page-title'>选择具体措施</h2><p class='page-copy'>可以修改目标、Skill、资料与预期输出。</p></section><section class='card'><h2>推荐措施</h2><div class='chip-row'><span class='chip practical'>形成执行计划</span><span class='chip practical'>设置检查节点</span><span class='chip'>自定义目标</span></div><label class='input-label' style='margin-top:14px' for='goal'>下一阶段目标</label><textarea id='goal' class='text-input' rows='3'>完成一个可展示的机器人嵌入式最小项目，并验证三类目标岗位要求。</textarea></section>";
        } else {
          body = "<section><h2 class='page-title'>确认下一阶段摘要</h2><p class='page-copy'>只有现在确认才创建新阶段；你仍可返回调整。</p></section><section class='card'><h2>阶段 2 · 用小项目验证路径</h2><p>方向：现实支持。措施：形成执行计划、设置检查节点。预期输出：行动计划。</p><div class='list-row'><span class='avatar'>3</span><div class='list-grow'><strong>3 位 Skill 继续参与</strong><span>职业、工程、反方风险视角</span></div></div><div class='list-row'><span class='avatar'>资</span><div class='list-grow'><strong>2 份资料、1 条个人背景将继承</strong><span>可在返回后调整</span></div></div></section><section class='card'><h2>创建后尚未运行</h2><p>创建后可撤销空阶段；一旦开始运行，改用停止或后续推进。</p></section>";
        }
        return stateBanner() + "<section class='stepper'><button class='step " + (advanceStep === 1 ? "active" : "") + "' data-step='1'>1 方向</button><button class='step " + (advanceStep === 2 ? "active" : "") + "' data-step='2'>2 措施</button><button class='step " + (advanceStep === 3 ? "active" : "") + "' data-step='3'>3 确认</button></section>" + body + "<div class='button-row'><button class='button' data-step='" + Math.max(1, advanceStep - 1) + "'>上一步</button><button class='button primary' data-step='" + Math.min(3, advanceStep + 1) + "'>" + (advanceStep === 3 ? "确认并创建阶段" : "继续") + "</button></div>";
      }

      function issuesView() {
        if (state === "Empty") { return stateBanner() + emptyCard("还没有保存的议题", "从首页创建议题"); }
        return stateBanner() +
          "<section><p class='eyebrow'>持续容器</p><h2 class='page-title'>你的议题</h2><p class='page-copy'>进行中、已归档与回收站始终分段显示。</p></section>" +
          "<section class='card'><h2>进行中</h2><div class='list-row'><span class='avatar'>1</span><div class='list-grow'><strong>机器人嵌入式岗位转向</strong><span>阶段 1 · 2 位 Skill 已完成 · 今天</span></div><span class='chip warning'>部分完成</span></div><div class='list-row'><span class='avatar'>2</span><div class='list-grow'><strong>整理下半年学习节奏</strong><span>阶段 2 · 已保存成果 · 昨天</span></div><span class='chip success'>可继续</span></div></section>" +
          "<section class='card'><h2>已归档</h2><p>归档可恢复继续，历史阶段、资料和成果保持连续。</p><button class='button'>查看已归档议题</button></section>" +
          "<section class='card'><h2>回收站</h2><p>回收站没有自动过期；恢复与彻底清除严格分离。</p><button class='button danger'>打开回收站</button></section>";
      }

      function resourcesView() {
        return stateBanner() +
          "<section><p class='eyebrow'>资料与成果</p><h2 class='page-title'>让判断可回看</h2><p class='page-copy'>资料、个人背景和成果保持不同对象语义。</p></section>" +
          "<section class='mode-tabs'><button class='active'>资料</button><button>成果</button><button>个人背景</button></section>" +
          "<section class='card'><h2>嵌入式项目经历梳理</h2><p>个人笔记 · 更新于今天 · 已关联「机器人嵌入式岗位转向」</p><div class='chip-row'><span class='chip'>本地笔记</span><span class='chip success'>本阶段已使用</span></div></section>" +
          "<section class='card'><h2>目标岗位 JD 对比</h2><p>外部来源 · 采集于 2026-08-01 · 可检查时效和来源。</p><div class='button-row'><button class='button'>查看来源</button><button class='button'>打开关联议题</button></div></section>" +
          "<button class='button primary'>添加资料或个人背景</button>";
      }

      function skillsView() {
        return stateBanner() +
          "<section><p class='eyebrow'>能力目录</p><h2 class='page-title'>选择合适的视角与顾问</h2><p class='page-copy'>Skill 的名称、类型、边界和可用性始终有文字表达。</p></section>" +
          "<section class='card'><label class='input-label' for='search'>搜索 Skill</label><input id='search' class='text-input' value='嵌入式' aria-label='搜索 Skill'><div class='chip-row' style='margin-top:10px'><span class='chip'>专业顾问</span><span class='chip'>人物视角</span><span class='chip'>任务助手</span></div></section>" +
          "<section class='card'><div class='list-row'><span class='avatar'>嵌</span><div class='list-grow'><strong>嵌入式工程顾问</strong><span>专业顾问 · 可用 · 评估技术路径</span><span>边界：提供分析与计划，不替代实际工程验证。</span></div><button class='text-action'>详情</button></div><div class='list-row'><span class='avatar'>去</span><div class='list-grow'><strong>去AI化助手</strong><span>任务助手 · 可用 · 现实沟通表达</span><span>让真实内容更像你本人表达，不用于规避检测或伪造事实。</span></div><button class='text-action'>详情</button></div></section>";
      }

      function settingsView() {
        return stateBanner() +
          "<section><p class='eyebrow'>设置</p><h2 class='page-title'>安全地管理工作台</h2><p class='page-copy'>按风险从低到高分组；API Key 绝不在界面或日志中完整显示。</p></section>" +
          "<section class='card'><h2>外观与无障碍</h2><div class='list-row'><span class='avatar'>字</span><div class='list-grow'><strong>字体与减少动效</strong><span>支持系统字号、200% 字号和减少动效。</span></div><button class='text-action'>调整</button></div></section>" +
          "<section class='card'><h2>模型与 API Key</h2><div class='list-row'><span class='avatar'>K</span><div class='list-grow'><strong>API Key 管理</strong><span>2 个可用 Key · 仅显示掩码和验证状态</span></div><button class='button primary'>管理</button></div><div class='list-row'><span class='avatar'>模</span><div class='list-grow'><strong>模型可用性</strong><span>不可用时必须说明原因，不能暗中换模型。</span></div><button class='text-action'>查看</button></div></section>" +
          "<section class='card'><h2>遥测与诊断</h2><p>当前：仅元数据。危险操作保留独立确认和影响说明。</p><button class='button'>打开诊断</button></section>";
      }

      function render() {
        document.getElementById("screen-name").textContent = labels[page][0];
        document.getElementById("screen-subtitle").textContent = labels[page][1];
        var view = {
          launch: launchView,
          home: homeView,
          recommend: recommendView,
          context: contextView,
          workspace: workspaceView,
          result: resultView,
          advance: advanceView,
          issues: issuesView,
          resources: resourcesView,
          skills: skillsView,
          settings: settingsView
        };
        var isWorkspace = page === "workspace";
        var device = document.querySelector(".device");
        var topbarAction = document.getElementById("topbar-action");
        var composer = document.getElementById("workspace-composer");
        device.classList.toggle("chat-mode", isWorkspace);
        if (isWorkspace) {
          topbarAction.removeAttribute("data-page");
          topbarAction.setAttribute("data-workspace-menu", "true");
          topbarAction.setAttribute("aria-label", "打开工作区功能");
          topbarAction.textContent = "⋯";
          composer.innerHTML = workspaceComposerView();
        } else {
          topbarAction.removeAttribute("data-workspace-menu");
          topbarAction.setAttribute("data-page", "settings");
          topbarAction.setAttribute("aria-label", "打开设置");
          topbarAction.textContent = "○";
          composer.innerHTML = "";
        }
        document.getElementById("screen-content").innerHTML = view[page]();
        var nodes = document.querySelectorAll("[data-page]");
        for (var i = 0; i < nodes.length; i++) {
          nodes[i].classList.toggle("active", nodes[i].getAttribute("data-page") === page);
        }
      }

      document.addEventListener("click", function (event) {
        var pageButton = event.target.closest("[data-page]");
        if (pageButton && !pageButton.disabled) {
          page = pageButton.getAttribute("data-page");
          workspaceMenuOpen = false;
          composerMenuOpen = false;
          render();
          return;
        }
        var workspaceMenu = event.target.closest("[data-workspace-menu]");
        if (workspaceMenu) {
          workspaceMenuOpen = !workspaceMenuOpen;
          render();
          return;
        }
        var composerMenu = event.target.closest("[data-composer-menu]");
        if (composerMenu) {
          composerMenuOpen = !composerMenuOpen;
          render();
          return;
        }
        var direction = event.target.closest("[data-direction]");
        if (direction) {
          var key = direction.getAttribute("data-direction");
          selectedDirections[key] = !selectedDirections[key];
          render();
          return;
        }
        var mode = event.target.closest("[data-mode]");
        if (mode) {
          workspaceMode = mode.getAttribute("data-mode");
          composerMenuOpen = false;
          render();
          return;
        }
        var step = event.target.closest("[data-step]");
        if (step) {
          advanceStep = Number(step.getAttribute("data-step"));
          render();
        }
      });

      document.getElementById("prototype-state").addEventListener("change", function (event) {
        state = event.target.value;
        render();
      });
      document.getElementById("dark-toggle").addEventListener("change", function (event) {
        document.documentElement.setAttribute("data-theme", event.target.checked ? "dark" : "light");
      });
      document.getElementById("motion-toggle").addEventListener("change", function (event) {
        document.documentElement.setAttribute("data-reduced-motion", event.target.checked ? "true" : "false");
      });
      document.getElementById("font-scale").addEventListener("input", function (event) {
        var value = Number(event.target.value);
        document.documentElement.style.setProperty("--font-scale", value);
        document.getElementById("font-scale-value").textContent = Math.round(value * 100) + "%";
      });

      render();
    }());
  </script>
</body>
</html>
